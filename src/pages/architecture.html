<dl>
  <dt>Sources</dt>
  <dd>Independent systems report facts about an entity.</dd>
  <dt>ZooGlass</dt>
  <dd>
    A view definition maps events to fields. The configured rules decide which
    values ZooGlass retains.
  </dd>
  <dt>Applications</dt>
  <dd>
    Subscribers receive a snapshot and subsequent changes. Each application
    chooses how to present them.
  </dd>
